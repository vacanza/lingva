name: Test and publish

on:
  - pull_request
  - push

env:
  DEFAULT_PYTHON_VERSION: '3.14'
  FORCE_COLOR: 1

permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --frozen --no-install-project --no-build

      - name: Run pre-commit
        run: uv run --no-sync --no-build pre-commit run --show-diff-on-failure --color=always --all-files

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    needs:
      - pre-commit
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version-file: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --no-build --extra chameleon --link-mode=copy

      - name: Run tests
        run: uv run --no-sync pytest -v

  publish:
    name: Publish to PyPI
    if: |
      github.repository == 'vacanza/lingva' &&
      github.event_name == 'push' &&
      startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          version-file: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Build wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
